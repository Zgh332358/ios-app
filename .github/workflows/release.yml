name: Release

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Scheme to build'
        required: true
        default: 'Resonance'
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build iOS Project
        id: build
        env:
          SCHEME: ${{ inputs.scheme }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          xcodebuild -project Resonance.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath build/Resonance.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        if: success()
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Resonance.xcarchive \
            -exportPath build \
            -exportOptionsPlist .github/export_options.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-${{ inputs.configuration }}
          path: build/Resonance.ipa
          retention-days: 30

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/**/*.xcresult
